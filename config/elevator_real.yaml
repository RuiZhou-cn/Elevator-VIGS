# Elevator run config for the OdinOne recordings in data/Elevator-VIGS/real/. Every
# site shares the same calib, IMU and Tcb, so the only per-sequence quantity is the metric reference
# in Elevator.sequences, read directly by the eval (eval_elevator_mono.py) --
# demo.py itself never sees this section.
#
# A config holds what differs between datasets: the sensor (IMU noise model, camera-IMU
# extrinsics, time units and offset), the IMU-init keyframe and loop closure. The algorithm
# hyper-parameters shared by every dataset, the elevator detector's included, live in
# vigs/config_defaults.py; a key given here overrides its default. The eval script reads this
# file and never writes it back.
Dataset:
  pcd_downsample: 64      # pixel stride of the Gaussians seeded from a keyframe
  scale_multiplier: 2.0   # initial metric-scale guess before the IMU init: mean inverse depth x this

IMU:
  frequency: 400
  accelerometer_noise_density: 0.00207649074
  accelerometer_random_walk:   0.00041327852
  gyroscope_noise_density:     0.00020544166
  gyroscope_random_walk:       1.110622e-05
  imu_time_offset: 0.00
  rgb_file_in_nanoseconds: false
  imu_in_nanoseconds: false
  init_g: [0.0, 0.0, -9.81]
  Tcb_np:
    - [ 2.38000000e-03, -1.00000000e+00,  8.30000000e-04,  5.68021088e-02]
    - [-1.00000000e-05, -8.30000000e-04, -1.00000000e+00,  2.70171357e-02]
    - [ 1.00000000e+00,  2.38000000e-03, -1.00000000e-05,  2.45616807e-02]
    - [ 0.00000000e+00,  0.00000000e+00,  0.00000000e+00,  1.00000000e+00]

Tracking:
  frontend:
    # keyframe index at which the inertial init fires (InitializeVeloBiasGdir) and from which
    # IMU dead-reckoning seeds each new keyframe's pose
    imu_late_init_from: 20
  pgba:
    active: True

Elevator:
  # Metric reference per sequence, keyed by the sequence's directory name under data/Elevator-VIGS/real/
  # == the eval name (eval_elevator_mono.py). Scored on the still windows of
  # control_points.json, never on a ride label. gt_rise = laser H [m] between the two
  # control-point plates; round trips carry {} (e_z references 0, no H needed).
  sequences:
    Office1:        {gt_rise: 14.265}
    Office2:        {gt_rise: 16.777}
    Office3:        {}
    Office4:        {}
    Station1:       {gt_rise: 7.285}
    Station2:       {}
    Station3:       {}
    Residential1:   {gt_rise: 19.788}
    Residential2:   {gt_rise: 49.975}
    Residential3:   {}
    Campus1:        {gt_rise: 13.648}
    Campus2:        {gt_rise: 15.068}
    Campus3:        {gt_rise: 15.969}
    Campus4:        {}
    Campus5:        {}
    Campus6:        {}
