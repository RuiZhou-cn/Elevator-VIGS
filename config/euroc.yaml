# A config holds what differs between datasets: the sensor (IMU noise model, camera-IMU
# extrinsics, time units and offset), the IMU-init keyframe and loop closure. The algorithm
# hyper-parameters shared by every dataset live in vigs/config_defaults.py; a key given here
# overrides its default.
Dataset:
  pcd_downsample: 64      # pixel stride of the Gaussians seeded from a keyframe
  scale_multiplier: 2.0   # initial metric-scale guess before the IMU init: mean inverse depth x this

IMU:
  frequency: 200
  accelerometer_noise_density: 2.0000e-3
  accelerometer_random_walk:   3.0000e-3
  gyroscope_noise_density:     1.6968e-04
  gyroscope_random_walk:       1.9393e-05
  imu_time_offset: 0.0
  rgb_file_in_nanoseconds: true
  imu_in_nanoseconds: true
  init_g: [0.0, 0.0, -9.81]
  Tcb_np:
    - [  0.01486554,   0.99955725,  -0.02577444,   0.06522291 ]
    - [ -0.99988093,   0.01496721,   0.00375619,  -0.02070639 ]
    - [  0.00414030,   0.02571553,   0.99966073,  -0.00805460 ]
    - [  0.0,          0.0,          0.0,          1.0        ]

Tracking:
  frontend:
    # keyframe index at which the inertial init fires (InitializeVeloBiasGdir) and from which
    # IMU dead-reckoning seeds each new keyframe's pose
    imu_late_init_from: 20
  pgba:
    active: True

# No elevator in this set: any ride the detector fires here is a false positive.
